[package]
name = "kicad_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Everything here builds for wasm32-unknown-unknown as well as natively:
# no tokio, no web-sys, no crate that needs the operating system.
[dependencies]
derive_more = { version = "2", default-features = false, features = ["display", "error"] }
# Fill and stroke tessellation (tessellate.rs): the triangles the viewer
# draws and the thumbnail renderer will draw. std only: no serde, no
# debugger hooks.
lyon_tessellation = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
test-case = "3"
