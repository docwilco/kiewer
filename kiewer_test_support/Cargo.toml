[package]
name = "kiewer_test_support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Dev-only: what the workspace's tests share. Never a dependency of a
# shipped crate.
publish = false

[lints]
workspace = true

[dependencies]
kiewer_lib = { path = "../kiewer_lib" }
# The pool type the Postgres helper hands out; the features are the
# library's, unified by cargo.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "rt"] }
