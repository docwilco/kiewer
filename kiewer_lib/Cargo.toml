[package]
name = "kiewer_lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
askama = { version = "0.14", default-features = false, features = ["derive", "std"] }
async-trait = "0.1"
# http1 only: Fastly and Cloud Run's front end speak HTTP/1.1 to the
# container. form: the handle and sign-out forms; json: /api/me; query:
# the OAuth callback's code and state; multipart: the upload form's
# files, streamed part by part (multer underneath).
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "multipart", "query", "tokio"] }
# cookie: the session and OAuth-state cookie jar. Neither signed nor
# private: the session cookie is an opaque random id and the state cookie
# is compared with the provider's echo, so neither carries a claim.
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
derive_more = { version = "2", features = ["display", "error", "from"] }
# The GCS store's upload payload type (blob/gcs.rs); in the tree already.
bytes = "1"
# The description's Markdown (docs/v1-scope.md, Pages and URLs): CommonMark
# with the table and strikethrough extensions, rendered through the
# allow-list of kiewer_lib::description. No features: the defaults are the
# command-line tool, syntax highlighting and a builder, none of which the
# server renders with.
comrak = { version = "0.59", default-features = false }
flate2 = "1"
# The GCS store (blob/gcs.rs): Google's own client. Its data path is the
# JSON API, which the fake-gcs-server emulator speaks (object_store's XML
# PUT it does not); application-default credentials and the metadata
# server on Cloud Run come with it; with_endpoint reaches an emulator. Its
# default feature is the rustls provider the TLS needs. google-cloud-auth
# is for the anonymous credentials an emulator takes, google-cloud-gax
# names the client builder's error type.
google-cloud-auth = { version = "1.18", default-features = false }
google-cloud-gax = { version = "1.15", default-features = false }
google-cloud-storage = "1.21"
# The board parser and model: the server parses every uploaded board for
# its metadata (docs/v1-scope.md, Uploads, S8).
kicad_core = { path = "../kicad_core" }
# The viewer's own renderer, headless on Vulkan (lavapipe in the server
# image, ADR 0004): the thumbnails are drawn by the code the browser runs,
# linked as a native library.
kiewer_viewer = { path = "../kiewer_viewer" }
# The authorization-code exchange with PKCE, over reqwest with rustls; the
# reqwest line below is the same major so one client serves the token call
# and the provider's user call.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
# The path of a file in its download URL and the RFC 8187 `filename*`
# of its Content-Disposition (web/files.rs). In the tree already through
# url and askama.
percent-encoding = { version = "2", default-features = false }
# 0.8, the major sqlx and oauth2 already bring: OsRng for session ids.
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The upload's temporary files: one directory per upload under the
# system's temporary directory, removed with it, named so two uploads
# never collide. In the tree already through kiewer_test_support.
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
# The Duration type a cookie's Max-Age takes (the cookie crate's, which
# axum-extra does not re-export). Nothing else: the clock is Postgres's.
time = { version = "0.3", default-features = false }
# fs and io-util: the upload's parts streamed into temporary files.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "time"] }
tracing = "0.1"
# The zip in an upload (upload/archive.rs): the central directory read
# first, entries inflated one by one. Deflate alone, through the flate2
# already in the tree; no other method, no time crate, no encryption.
# Pinned exactly: it parses untrusted uploads and ships several releases a
# week, so a release is taken once it has aged two weeks. 9.0.5 was the
# newest such on 2026-11-02. Later readers are faster on a hostile zip, which
# archive.rs's screen bounds on any version; moving up is its own issue.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
# The static assets (docs/v1-scope.md, Caching; build.rs): the viewer's
# script and wasm are named by their SHA-256 and pre-compressed as brotli
# and gzip at build time. brotli is Dropbox's encoder in Rust, so no C
# library joins the build; std alone, for the Write adapter, none of its
# ffi, simd or validation features. flate2 and sha2 are the versions the
# library already builds with.
brotli = { version = "9", default-features = false, features = ["std"] }
flate2 = "1"
sha2 = "0.11"

[dev-dependencies]
# The browser test (tests/it/browser.rs): chrome-headless-shell driven over
# the Chrome DevTools Protocol, on the tokio the tests already run. No
# features: the default `bytes` is a byte-buffer type the test never
# names, and the fetcher downloads a browser, which scripts/browser.sh
# does at the pinned version instead.
chromiumoxide = { version = "0.9.1", default-features = false }
# StreamExt::next over chromiumoxide's protocol handler and event streams,
# which are futures streams; in the tree already through chromiumoxide.
futures-util = { version = "0.3", default-features = false }
kiewer_assert = { path = "../kiewer_assert" }
# The brotli decoder, so the asset test reads the .br variant back.
brotli = { version = "9", default-features = false, features = ["std"] }
kiewer_test_support = { path = "../kiewer_test_support" }
test-case = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# The layer the server's JSON log runs on Cloud Run (kiewer/src/log.rs) and
# the registry under it, so the beacon test reads the line a Cloud Logging
# metric reads.
tracing-stackdriver = "0.10"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
