<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiewer</title>
</head>
<body>
<nav id="account" hidden>
<!-- Filled by the script below from /api/me: this page is the same for
     everyone and cacheable (ADR 0003), so nothing in it may depend on
     the session. -->
<span id="signed-out"><a href="/auth/github" rel="nofollow">Sign in with GitHub</a></span>
<span id="signed-in" hidden><span id="handle"></span> <form method="post" action="/auth/sign-out" style="display:inline"><button type="submit">Sign out</button></form></span>
</nav>
<h1>kiewer</h1>
<p>A site for uploading and sharing KiCad designs, rendered in the browser.</p>
<p><small>{{ build }}</small></p>
<script>
fetch("/api/me", { credentials: "same-origin", cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (me) {
    if (me.signed_in && !me.handle) { location.replace("/welcome"); return; }
    if (me.signed_in) {
      document.getElementById("handle").textContent = me.handle;
      document.getElementById("signed-out").hidden = true;
      document.getElementById("signed-in").hidden = false;
    }
    document.getElementById("account").hidden = false;
  })
  .catch(function () { document.getElementById("account").hidden = false; });
</script>
</body>
</html>
