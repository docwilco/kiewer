<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>midi8knob - kiewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2b2b; color: #d0d2cd; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 1em; align-items: baseline; padding: 0.4em 0.8em; }
  header h1 { font-size: 1em; font-weight: normal; margin: 0; }
  header a { color: inherit; }
  header button { font: inherit; }
  #stage { flex: 1; position: relative; min-height: 0; }
  /* touch-action: none, so a two-finger pinch reaches the pointer events
     instead of zooming the page. */
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { opacity: 0.7; }
  #error { position: absolute; left: 0.8em; right: 0.8em; top: 0.8em; padding: 0.6em 0.8em; background: #5a1e1e; border-radius: 4px; white-space: pre-wrap; }
  #hint { position: absolute; left: 0.8em; bottom: 0.6em; opacity: 0.6; }
</style>
</head>
<body>
<header>
  <h1><a href="/">kiewer</a> / midi8knob</h1>
  <span>Edge.Cuts + F.Cu</span>
  <button id="fit" type="button" title="Home">Fit</button>
  <span id="status"></span>
</header>
<div id="stage">
  <canvas id="board"></canvas>
  <p id="error" hidden></p>
  <p id="hint">wheel zooms, ctrl+wheel and shift+wheel pan, middle or right drag pans, + and - zoom, Home fits</p>
</div>
<p hidden><small>{{ build }}</small></p>
{% if !embedded %}
<p id="not-built">the viewer is not built into this server: run scripts/build-viewer.sh, then build again</p>
{% endif %}
<script type="module">
// The page owns the listeners and hands each gesture to the wasm in
// device pixels; the camera (f64) and the drawing are Rust. The bindings
// are KiCad's (docs/v1-scope.md, Rendering, Zoom).
import init, { Viewer } from "/viewer/kiewer_viewer.js";

const canvas = document.getElementById("board");
const status = document.getElementById("status");
const errorBox = document.getElementById("error");
let viewer = null;
let frame = 0;

function fail(message) {
  errorBox.textContent = String(message);
  errorBox.hidden = false;
}
function dpr() { return window.devicePixelRatio || 1; }
function point(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * dpr(), (e.clientY - r.top) * dpr()];
}
function schedule() {
  if (frame || !viewer) return;
  frame = requestAnimationFrame(function () {
    frame = 0;
    try { viewer.render(); } catch (e) { fail(e); }
  });
}
function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width * dpr()));
  canvas.height = Math.max(1, Math.round(r.height * dpr()));
  if (viewer) { viewer.resize(canvas.width, canvas.height); schedule(); }
}

// Wheel: zoom at the pointer; with ctrl a horizontal pan and with shift a
// vertical one, as KiCad binds them. A trackpad pinch also arrives as a
// wheel with ctrlKey, told apart from a mouse wheel with ctrl held by its
// fractional, small pixel deltas (a mouse notch is an integer of 40 or
// more, or arrives in line or page mode). Non-passive, so preventDefault
// keeps the page from scrolling or zooming.
const PINCH_GAIN = 5;
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  if (!viewer) return;
  const [x, y] = point(e);
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? canvas.clientHeight : 1;
  const dx = e.deltaX * unit, dy = e.deltaY * unit;
  const notch = e.deltaMode !== 0 || (Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);
  if (e.ctrlKey && !notch) {
    viewer.wheel(x, y, dy * PINCH_GAIN);
  } else if (e.ctrlKey) {
    viewer.pan(x, y, x - dy, y);
  } else if (e.shiftKey) {
    viewer.pan(x, y, x, y - (dy || dx));
  } else {
    if (dx) viewer.pan(x, y, x - dx, y);
    if (dy) viewer.wheel(x, y, dy);
  }
  schedule();
}, { passive: false });

// Pointers: a mouse pans with the middle or right button (the left is
// kept for selection later); a touch or pen pans with one pointer and
// pinches with two.
const pointers = new Map();
canvas.addEventListener("pointerdown", function (e) {
  if (e.pointerType === "mouse" && e.button !== 1 && e.button !== 2) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, point(e));
  e.preventDefault();
});
canvas.addEventListener("pointermove", function (e) {
  if (!viewer || !pointers.has(e.pointerId)) return;
  const now = point(e);
  if (pointers.size === 2) {
    const [idA, idB] = Array.from(pointers.keys());
    const a0 = pointers.get(idA), b0 = pointers.get(idB);
    const a1 = e.pointerId === idA ? now : a0;
    const b1 = e.pointerId === idB ? now : b0;
    viewer.pinch(a0[0], a0[1], b0[0], b0[1], a1[0], a1[1], b1[0], b1[1]);
  } else if (pointers.size === 1) {
    const was = pointers.get(e.pointerId);
    viewer.pan(was[0], was[1], now[0], now[1]);
  }
  pointers.set(e.pointerId, now);
  schedule();
});
function release(e) { pointers.delete(e.pointerId); }
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
canvas.addEventListener("dblclick", function (e) {
  if (!viewer) return;
  const [x, y] = point(e);
  viewer.zoom_at(x, y, 2);
  schedule();
});

// Safari reports a trackpad pinch as gesture events with a running scale.
let gestureScale = 1;
canvas.addEventListener("gesturestart", function (e) { e.preventDefault(); gestureScale = 1; });
canvas.addEventListener("gesturechange", function (e) {
  e.preventDefault();
  if (!viewer || !e.scale) return;
  const [x, y] = point(e);
  viewer.zoom_at(x, y, e.scale / gestureScale);
  gestureScale = e.scale;
  schedule();
});

function fit() { if (viewer) { viewer.fit(); schedule(); } }
document.getElementById("fit").addEventListener("click", fit);
window.addEventListener("keydown", function (e) {
  if (!viewer || e.target instanceof HTMLInputElement) return;
  if (e.key === "+" || e.key === "=") viewer.step(1);
  else if (e.key === "-" || e.key === "_") viewer.step(-1);
  else if (e.key === "Home") fit();
  else return;
  e.preventDefault();
  schedule();
});
new ResizeObserver(resize).observe(canvas);

try {
  await init();
  resize();
  viewer = await Viewer.create(canvas, canvas.width, canvas.height);
  const samples = viewer.samples();
  status.textContent = viewer.backend() + (samples > 1 ? ", " + samples + "x msaa" : "");
  const response = await fetch("{{ board_path }}");
  if (!response.ok) throw new Error("the board: HTTP " + response.status);
  viewer.load_board(await response.text());
  schedule();
} catch (e) {
  fail(e && e.message ? e.message : e);
}
</script>
</body>
</html>
