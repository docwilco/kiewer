<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} schematic - kiewer</title>
<style>
  /* KiCad's default schematic theme: the paper colour behind the sheet. */
  html, body { margin: 0; height: 100%; background: #f5f4ef; color: #222; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 1em; align-items: baseline; padding: 0.4em 0.8em; }
  header h1 { font-size: 1em; font-weight: normal; margin: 0; }
  header a { color: inherit; }
  header button { font: inherit; }
  #stage { flex: 1; position: relative; min-height: 0; }
  /* touch-action: none, so a two-finger pinch reaches the pointer events
     instead of zooming the page. */
  #sheet { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { opacity: 0.7; }
  #error { position: absolute; left: 0.8em; right: 0.8em; top: 0.8em; padding: 0.6em 0.8em; background: #f3c2c2; border-radius: 4px; white-space: pre-wrap; }
  #hint { position: absolute; left: 0.8em; bottom: 0.6em; opacity: 0.6; }
  #zoom { position: absolute; right: 0.8em; bottom: 0.6em; opacity: 0.8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1><a href="/">kiewer</a> / {{ title }} / schematic</h1>
  {% if let Some(url) = design_url %}<a href="{{ url }}">board</a>{% endif %}
  <button id="fit" type="button" title="Home">Fit</button>
  <span id="status"></span>
</header>
<div id="stage">
  <canvas id="sheet"></canvas>
  <p id="error" hidden></p>
  <p id="hint">wheel zooms, ctrl+wheel and shift+wheel pan, middle or right drag pans, + and - zoom, Home fits</p>
  <p id="zoom"></p>
</div>
<p hidden><small>{{ build }}</small></p>
{% if !embedded %}
<p id="not-built">{{ not_built }}</p>
{% endif %}
<script>
// A wasm panic reaches the page as a bare "unreachable" trap; its message
// goes through console_error_panic_hook to console.error first. This
// classic script runs before the module below, so a panic inside
// Viewer.create or load_schematic is kept too; the beacon block at the
// end of the module reads kiewerPanic and listens for kiewer-panic.
(function () {
  window.kiewerPanic = "";
  var original = console.error.bind(console);
  console.error = function () {
    var text = Array.prototype.map.call(arguments, String).join(" ");
    if (text.startsWith("panicked at")) {
      window.kiewerPanic = text.split("\n\nStack:")[0];
      window.dispatchEvent(new Event("kiewer-panic"));
    }
    original.apply(console, arguments);
  };
})();
</script>
<script type="module">
// The same gestures as the board page (viewer.html), handed to the same
// wasm Viewer in device pixels; only the load call differs. The bindings
// are KiCad's (docs/v1-scope.md, Rendering, Zoom).
import init, { Viewer } from "/viewer/kiewer_viewer.js";

const canvas = document.getElementById("sheet");
const status = document.getElementById("status");
const errorBox = document.getElementById("error");
const zoomBox = document.getElementById("zoom");
let viewer = null;
let frame = 0;
let gesturing = false;

function fail(message) {
  errorBox.textContent = String(message);
  errorBox.hidden = false;
}
function dpr() { return window.devicePixelRatio || 1; }
function point(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * dpr(), (e.clientY - r.top) * dpr()];
}
function schedule() {
  if (frame || !viewer) return;
  frame = requestAnimationFrame(function () {
    frame = 0;
    try { viewer.render(); } catch (e) { fail(e); }
    showZoom();
  });
}
function showZoom() {
  if (!viewer) return;
  const zoom = viewer.zoom();
  if (!(zoom > 0)) { zoomBox.textContent = ""; return; }
  zoomBox.textContent = zoom.toPrecision(3).replace(/\.?0+$/, "") + "x fit, "
    + viewer.scale().toPrecision(3) + " px/mm";
}
function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width * dpr()));
  canvas.height = Math.max(1, Math.round(r.height * dpr()));
  if (viewer) { viewer.resize(canvas.width, canvas.height); schedule(); }
}

const PINCH_GAIN = 5;
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  if (!viewer) return;
  const [x, y] = point(e);
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? canvas.clientHeight : 1;
  const dx = e.deltaX * unit, dy = e.deltaY * unit;
  const notch = e.deltaMode !== 0 || (Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);
  if (e.ctrlKey && !notch) {
    if (!gesturing) viewer.wheel(x, y, dy * PINCH_GAIN);
  } else if (e.ctrlKey) {
    viewer.pan(x, y, x - dy, y);
  } else if (e.shiftKey) {
    viewer.pan(x, y, x, y - (dy || dx));
  } else {
    if (dx) viewer.pan(x, y, x - dx, y);
    if (dy) viewer.wheel(x, y, dy);
  }
  schedule();
}, { passive: false });

const pointers = new Map();
canvas.addEventListener("pointerdown", function (e) {
  if (e.pointerType === "mouse" && e.button !== 1 && e.button !== 2) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, point(e));
  e.preventDefault();
});
canvas.addEventListener("pointermove", function (e) {
  if (!viewer || !pointers.has(e.pointerId)) return;
  const now = point(e);
  if (pointers.size === 2) {
    const [idA, idB] = Array.from(pointers.keys());
    const a0 = pointers.get(idA), b0 = pointers.get(idB);
    const a1 = e.pointerId === idA ? now : a0;
    const b1 = e.pointerId === idB ? now : b0;
    viewer.pinch(a0[0], a0[1], b0[0], b0[1], a1[0], a1[1], b1[0], b1[1]);
  } else if (pointers.size === 1) {
    const was = pointers.get(e.pointerId);
    viewer.pan(was[0], was[1], now[0], now[1]);
  }
  pointers.set(e.pointerId, now);
  schedule();
});
function release(e) { pointers.delete(e.pointerId); }
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
canvas.addEventListener("dblclick", function (e) {
  if (!viewer) return;
  const [x, y] = point(e);
  viewer.double_click(x, y);
  schedule();
});

let gestureScale = 1;
canvas.addEventListener("gesturestart", function (e) { e.preventDefault(); gestureScale = 1; gesturing = true; });
canvas.addEventListener("gestureend", function (e) { e.preventDefault(); gesturing = false; });
canvas.addEventListener("gesturechange", function (e) {
  e.preventDefault();
  if (!viewer || !e.scale) return;
  const [x, y] = point(e);
  viewer.zoom_at(x, y, e.scale / gestureScale);
  gestureScale = e.scale;
  schedule();
});

function fit() { if (viewer) { viewer.fit(); schedule(); } }
document.getElementById("fit").addEventListener("click", fit);
window.addEventListener("keydown", function (e) {
  if (!viewer || e.target instanceof HTMLInputElement) return;
  if (e.key === "+" || e.key === "=") viewer.step(1);
  else if (e.key === "-" || e.key === "_") viewer.step(-1);
  else if (e.key === "Home") fit();
  else return;
  e.preventDefault();
  schedule();
});
new ResizeObserver(resize).observe(canvas);

try {
  await init();
  resize();
  viewer = await Viewer.create(canvas, canvas.width, canvas.height);
  const samples = viewer.samples();
  status.textContent = viewer.backend() + (samples > 1 ? ", " + samples + "x msaa" : "");
  status.title = viewer.fallback_reasons();
{% if let Some(url) = schematic_url %}
  const response = await fetch("{{ url }}");
  if (!response.ok) throw new Error("the schematic: HTTP " + response.status);
  viewer.load_schematic(await response.text());
{% else %}
  status.textContent += ", no schematic in this revision";
{% endif %}
  schedule();
} catch (e) {
  fail(e && e.message ? e.message : e);
}

// Telemetry, as on the board page (docs/v1-scope.md, Telemetry; the
// server side is kiewer_lib/src/web/beacon.rs): one beacon per page load
// after the adapter init, one more on a wasm panic.
const BEACON_PATH = "/api/beacon";
const MAX_REASON = 1024;
const MAX_VENDOR = 64;
function fromViewer(read, fallback) {
  try { return viewer ? read() : fallback; } catch (e) { return fallback; }
}
const backendName = fromViewer(function () { return viewer.backend(); },
  /^(webgpu|webgl2)\b/.test(status.textContent) ? status.textContent.split(",")[0] : "none");
let vendorName = fromViewer(function () { return viewer.adapter_vendor(); }, "");
let panicSent = false;
function bounded(text, max) {
  text = String(text || "").slice(0, max);
  return /[\uD800-\uDBFF]$/.test(text) ? text.slice(0, -1) : text;
}
function sendBeacon(outcome, reason) {
  if (!navigator.sendBeacon) return;
  const body = JSON.stringify({
    backend: backendName,
    webgpu_present: "gpu" in navigator,
    outcome: outcome,
    reason: bounded(reason, MAX_REASON),
    vendor: bounded(vendorName.toLowerCase(), MAX_VENDOR),
  });
  try { navigator.sendBeacon(BEACON_PATH, body); } catch (e) { /* telemetry never fails the page */ }
}
function sendPanic() {
  if (panicSent) return;
  panicSent = true;
  sendBeacon("panic", window.kiewerPanic);
}
async function webgpuVendor() {
  if (vendorName || backendName !== "webgpu" || !navigator.gpu) return vendorName;
  try {
    const adapter = await Promise.race([
      navigator.gpu.requestAdapter(),
      new Promise(function (resolve) { setTimeout(resolve, 1000, null); }),
    ]);
    return adapter && adapter.info ? adapter.info.vendor : "";
  } catch (e) { return ""; }
}
window.addEventListener("kiewer-panic", sendPanic);
if (window.kiewerPanic) {
  sendPanic();
} else if (viewer) {
  vendorName = await webgpuVendor();
  sendBeacon("ok", "");
} else {
  sendBeacon("failed", errorBox.textContent);
}
</script>
</body>
</html>
