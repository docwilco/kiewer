name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A push to main and a pull request run the checks, build the release
# binaries on the runner, build the runtime-only image around them and,
# on a push to main only, push it to Artifact Registry as :<short hash>
# and deploy it to the staging Cloud Run service. The last job cuts the
# Release: a push to main whose jobs are all green and whose Version sorts
# above every Release tag in git names that image by Version, deploys it
# to production, tags the commit and prunes the registry. Any other push
# ends at staging.
#
# GCP comes in through repository variables, so this file carries nothing
# Terraform (infra/) has to produce: GCP_PROJECT_ID, GCP_WIF_PROVIDER (the
# Workload Identity Federation provider resource name) and GCP_DEPLOY_SA
# (the service account CI impersonates, with Artifact Registry repoAdmin,
# for the prune's deletes, and Cloud Run developer on the two services).
#
# Every check job delegates to scripts/checks.sh, the same script the
# pre-commit hook runs, so CI and local checks cannot drift. Every cargo job runs its
# command through .github/actions/cargo-cached, which restores a rust-cache
# carrying the workspace crates, marks what the restored build already
# covers as fresh, runs the command and trims the target to what the
# command touched before the save; the action explains.
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./scripts/checks.sh fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/cargo-cached
        with:
          run: ./scripts/checks.sh clippy

  # The offline data in .sqlx/ that every other job's build compiles the
  # query macros against (scripts/checks.sh exports SQLX_OFFLINE=true),
  # checked against the statements and against the schema migrations/
  # makes, on a scratch database beside the service's
  # (scripts/sqlx-prepare.sh). Postgres as in the test job. sqlx-cli is
  # installed at the version Cargo.lock names for the sqlx crate
  # (scripts/sqlx-version.sh), inside the cached step, as the wasm job
  # installs wasm-bindgen-cli; README, Development installs the same way.
  # A program only the checks run, so the Dockerfile does not gain it.
  sqlx:
    name: Query cache
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiewer
          POSTGRES_PASSWORD: kiewer
          POSTGRES_DB: kiewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiewer -d kiewer"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://kiewer:kiewer@127.0.0.1:5432/kiewer
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo-cached
        with:
          run: |
            cargo install sqlx-cli --version "$(scripts/sqlx-version.sh)" --locked --no-default-features --features postgres,rustls
            ./scripts/checks.sh sqlx

  test:
    name: Test
    runs-on: ubuntu-latest
    # Postgres beside the job, as compose.yaml gives a dev box: the same
    # major and the same role, password and database triple, so the
    # DATABASE_URL below is .env.example's. The tests gated on DATABASE_URL
    # (kiewer_lib/tests/it/db.rs) run here; scripts/checks.sh test fails
    # without it and refuses its opt-out on CI (#68).
    # POSTGRES_USER is the image's superuser, so the test modules with a
    # database of their own (kiewer_collector, kiewer_plans) may create
    # it (#107).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiewer
          POSTGRES_PASSWORD: kiewer
          POSTGRES_DB: kiewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiewer -d kiewer"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://kiewer:kiewer@127.0.0.1:5432/kiewer
      # The GCS emulator the step below starts; the tests gated on it
      # (kiewer_lib/tests/it/gcs_blob_store.rs) run here, under the same
      # rule as DATABASE_URL.
      KIEWER_GCS_EMULATOR: http://127.0.0.1:8092
    steps:
      - uses: actions/checkout@v5
      # The programs the code or its tests run. This list, the Dockerfile's
      # apt layer and the dev-box setup move together: a program one of them
      # gains, all gain in the same commit (Postgres is a service above, not
      # a program on the runner). The browser below is the exception the
      # Dockerfile skips: only the tests run it, and the image runs none.
      #
      # mesa-vulkan-drivers: Mesa's lavapipe, the software Vulkan driver the
      # headless renderer draws with on a machine without a GPU (ADR 0004),
      # for the golden-image test (kiewer_viewer/tests/golden.rs) and the
      # thumbnail tests (kiewer_lib/tests/it/thumbnails.rs), which fail rather
      # than skip here when the loader finds no driver. The Vulkan loader
      # itself comes with the package.
      #
      # scripts/browser.sh packages: the shared libraries
      # chrome-headless-shell links against, for the browser stage.
      #
      # Not installed here: git, rsync and flock, which the pre-commit
      # hook's test (kiewer_lib/tests/it/pre_commit.rs) runs through the
      # hook, come with the runner image.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers $(scripts/browser.sh packages)
      # chrome-headless-shell at the version and checksum scripts/browser.sh
      # pins, for the browser stage below, which fails here without it.
      - run: scripts/browser.sh install
      # fake-gcs-server, the GCS emulator for kiewer_lib/tests/it/gcs_blob_store.rs:
      # Google's own storage client against it over plain http on the
      # loopback. Pinned by version and checksum; the tests make their own
      # buckets through its JSON API, so it starts empty. Only the tests run
      # it, so the Dockerfile does not gain it; a dev box runs the same
      # binary (README, Development).
      - name: Start the GCS emulator
        run: |
          version=1.56.1
          curl -fsSLO "https://github.com/fsouza/fake-gcs-server/releases/download/v$version/fake-gcs-server_${version}_Linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/fsouza/fake-gcs-server/releases/download/v$version/checksums.txt"
          grep "fake-gcs-server_${version}_Linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf "fake-gcs-server_${version}_Linux_amd64.tar.gz" fake-gcs-server
          ./fake-gcs-server -scheme http -host 127.0.0.1 -port 8092 -backend memory -public-host 127.0.0.1 &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8092/storage/v1/b >/dev/null && break; sleep 0.5; done
          rm -f "fake-gcs-server_${version}_Linux_amd64.tar.gz" checksums.txt
      # The browser stage runs here, after the test stage, on the native
      # build that stage leaves: it needs the server and the viewer for
      # the browser, so the wasm32 target and wasm-bindgen-cli come as in
      # the wasm job. It adds one compile of kiewer_lib with the viewer
      # embedded (scripts/checks.sh says why).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/cargo-cached
        with:
          run: |
            cargo install wasm-bindgen-cli --version "$(scripts/wasm-bindgen-version.sh)" --locked
            ./scripts/checks.sh test
            ./scripts/checks.sh browser

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo-cached
        with:
          run: ./scripts/checks.sh docs

  # The viewer crate for the browser, through wasm-bindgen. The target
  # and clippy come with the toolchain step; a dev box adds the target
  # with rustup (README, Development). wasm-bindgen-cli is installed at
  # the version Cargo.lock names for the wasm-bindgen crate
  # (scripts/wasm-bindgen-version.sh), inside the cached step so the
  # binary rides in the cached cargo bin and the install is a no-op after
  # the first run; the release-build job does the same.
  wasm:
    name: Viewer for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: ./.github/actions/cargo-cached
        with:
          run: |
            cargo install wasm-bindgen-cli --version "$(scripts/wasm-bindgen-version.sh)" --locked
            ./scripts/checks.sh wasm

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Read rust-version from the manifest(s) so this job never drifts from
      # what Cargo.toml claims. Lowest version wins in a workspace.
      - id: msrv
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].rust_version | select(. != null)' \
            | sort -V | head -n1)"
          test -n "$version" || { echo "no rust-version in any Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # rust-cache hashes every installed toolchain into its key, and the
      # runner image's preinstalled stable differs between the image versions
      # in rotation, so with stable left beside the MSRV toolchain the job's
      # key followed the runner it landed on and its cache was never found.
      # Nothing after this step needs stable: the toolchain step above made
      # the MSRV toolchain the default.
      - run: rustup toolchain uninstall stable
      # The query macros against .sqlx/, as every check builds them; this
      # job runs cargo directly rather than through scripts/checks.sh.
      - uses: ./.github/actions/cargo-cached
        env:
          SQLX_OFFLINE: true
        with:
          run: cargo check --workspace --all-targets

  # The release binaries on every push and pull request, handed to the
  # image job as a workflow artifact with three days of retention, since
  # the image job reads it within the run; a job of its own so it runs
  # beside the other jobs. scripts/release-build.sh is the one spelling
  # of the build, with the build stamp defaulting to the short hash of
  # HEAD. The cargo cache keeps the dependencies warm: GitHub lets a run
  # restore caches saved on its own ref and on the default branch, so a
  # push to main saves and a pull request's run reads main's and saves
  # nothing (a cache on a pull request's ref is read by that pull
  # request's later runs alone). The sha256 lines (the binaries, not
  # cargo's dep-info beside them) are their identity across the
  # hand-over; the image job prints the same lines.
  release-build:
    name: Release build
    # Pinned, not ubuntu-latest: the binaries link this runner's glibc
    # and must start on the Dockerfile's base, whose comment has the rule.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The wasm32 target and wasm-bindgen-cli as in the wasm job: the
      # release build starts with the viewer for the browser, which the
      # server binary embeds.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/cargo-cached
        with:
          shared-key: release
          save: ${{ github.event_name == 'push' }}
          run: |
            cargo install wasm-bindgen-cli --version "$(scripts/wasm-bindgen-version.sh)" --locked
            ./scripts/release-build.sh
      - run: sha256sum $(ls -d target/release/kiewer* | grep -v '\.d$')
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/kiewer*
            !target/release/*.d
          if-no-files-found: error
          retention-days: 3

  # The image on every push and pull request: the binaries come down, the
  # Dockerfile copies them in (no toolchain here; a plain docker build,
  # since a copy-only image has nothing worth a layer cache). On a push to
  # main the image is pushed to Artifact Registry as :<short hash>, the
  # digest printed, and that digest deployed to the staging service. A
  # pull request's run stops before the push (the last steps are for a
  # push; a fork has no identity to federate anyway), so the registry
  # holds only what main pushed. The hash-tagged images are pruned by the
  # registry's cleanup policy, defined in infra/; the Release tags by the
  # release job.
  image:
    name: Image
    needs: [release-build]
    # Pinned like release-build, one runner image for the three shipping
    # jobs; nothing links here.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: europe-west4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kiewer/kiewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: target/release
      - run: sha256sum $(ls -d target/release/kiewer* | grep -v '\.d$')
      - id: short
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # --provenance=false: one manifest and no attestation, so the registry
      # lists one image per push.
      #
      # kiewer:<short hash> is the image's name on the runner only, what the
      # push step below finds it by. It holds no registry path, so the build
      # needs no GCP variable.
      - run: docker build --provenance=false --build-arg "BUILD_VERSION=${{ steps.short.outputs.hash }}" -t "kiewer:${{ steps.short.outputs.hash }}" .
      # A project's smoke test goes here, between the build and the push:
      # a run of the image against what it needs, so what is pushed is
      # what ran. Without one, the push follows the build.
      #
      # The push and the deploy wait for the GCP variables: until the
      # Terraform in infra/ has produced them, a push to main builds the
      # image and ships nothing, and the run stays green.
      - if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2
      - if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Push the image as its short hash
        if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        id: push
        # The digest line is what the release job will name; its own
        # line names the same digest.
        shell: bash
        run: |
          short="${{ steps.short.outputs.hash }}"
          docker tag "kiewer:$short" "$IMAGE:$short"
          docker push "$IMAGE:$short"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$short")"
          echo "pushed $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Every push to main is a staging deploy of the image just pushed,
      # by digest. gcloud waits for the new revision to become ready and
      # fails the job if it does not; traffic moves only on success.
      - name: Deploy to staging
        if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        run: |
          gcloud run deploy kiewer-staging --project "${{ vars.GCP_PROJECT_ID }}" \
            --region europe-west4 --image "${{ steps.push.outputs.digest }}" --quiet

  # The cut, on a push to main only, as the last job of the run. It needs
  # every other job, not the image job alone: the image job needs only the
  # release build, so a run with a red Test still pushes an image, and that
  # run must tag nothing. A rerun of the red job on main reaches this job.
  #
  # The Version is read from the manifest, and scripts/release-cut.sh cuts
  # it only when it sorts above every Release tag in git (its header says
  # why). A Version already tagged, or one below the newest Release, means
  # a plain push, and the job ends there: the run has done what every push
  # does, and production never moves back to older code. Otherwise the job
  # deploys the digest of the image this run pushed to the production
  # service, names the image, makes the annotated tag and prunes the
  # registry. The names and the tag come after the deploy because they are
  # the record of a Release that happened: a failed deploy leaves the
  # Version untagged and nothing pointing at the image, so a rerun of this
  # job cuts it, and so does the green run of a fix pushed above the Bump.
  # Every step before the tag repeats to the same result.
  #
  # With the tag last, it cannot settle two runs racing for one Version;
  # the concurrency group does. Release jobs run one at a time, and the
  # later one finds the tag and ends. GitHub keeps one job waiting in a
  # group: a job already waiting when another arrives is cancelled, and a
  # rerun or the next push cuts its Version while it is still the newest.
  #
  # A Release moves traffic to the new revision once it is ready; a
  # Release candidate becomes a revision with no traffic under the Cloud
  # Run tag `rc`, reachable on its tag URL
  # (https://rc---kiewer-<hash>.a.run.app), so it is tried by hand. The
  # image production runs is the image this run built and staging already
  # ran.
  release:
    name: Release
    # Every other job of this workflow: a job added above joins this list.
    needs: [fmt, clippy, sqlx, test, docs, wasm, msrv, release-build, image]
    # The GCP variables as in the image job: until they exist nothing was
    # pushed, so there is nothing to name and no Release to record.
    if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    concurrency:
      group: release
      cancel-in-progress: false
    # Pinned like release-build, one runner image for the three shipping
    # jobs; nothing links here.
    runs-on: ubuntu-24.04
    permissions:
      # The push of the Release tag.
      contents: write
      id-token: write
    env:
      IMAGE: europe-west4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kiewer/kiewer
    steps:
      - uses: actions/checkout@v5
      - name: Read the Version and whether to cut it
        id: version
        # bash by name is bash with pipefail, so a read that fails is not
        # taken as an empty Version. The script writes the step's outputs
        # (version, kind, cut, prune); its header has the rules.
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kiewer") | .version')"
          scripts/release-cut.sh "$version"
      - if: steps.version.outputs.prune == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: steps.version.outputs.prune == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.version.outputs.cut == 'true'
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Read the digest of the image this run pushed
        if: steps.version.outputs.cut == 'true'
        id: digest
        # The short hash is the image's identity. The image job pushed it
        # earlier in the run, so it is missing only on a late rerun: the
        # cleanup policy takes an image older than a day and behind the
        # five most recent.
        shell: bash
        run: |
          short="$(git rev-parse --short HEAD)"
          if ! digest="$(docker buildx imagetools inspect "$IMAGE:$short" --format '{{.Manifest.Digest}}' 2>/dev/null)" || [ -z "$digest" ]; then
            echo "::error::the registry has no $IMAGE:$short; the image job of this run pushed it, so the cleanup policy has taken it. A new push cuts the Version"
            exit 1
          fi
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "digest=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy to production
        if: steps.version.outputs.cut == 'true'
        # A candidate's --no-traffic takes LATEST out of the service's
        # traffic for good: every later deploy, however it is spelled, gets
        # none until --to-latest puts LATEST back. So a plain Release asks
        # for it every time; after a plain Release it changes nothing. Its
        # failure fails this step, before the names and the tag, so the
        # run is red and a rerun does it again.
        shell: bash
        run: |
          kind="${{ steps.version.outputs.kind }}"
          traffic=()
          if [ "$kind" = candidate ]; then traffic=(--no-traffic --tag rc); fi
          gcloud run deploy kiewer --project "${{ vars.GCP_PROJECT_ID }}" \
            --region europe-west4 --image "${{ steps.digest.outputs.digest }}" \
            "${traffic[@]}" --quiet
          [ "$kind" != release ] || gcloud run services update-traffic kiewer \
            --project "${{ vars.GCP_PROJECT_ID }}" --region europe-west4 --to-latest --quiet
      - name: Name the image
        if: steps.version.outputs.cut == 'true'
        # imagetools create adds a tag to the manifest in the registry
        # without a pull; --prefer-index=false keeps it the same manifest
        # and digest.
        shell: bash
        run: |
          short="${{ steps.digest.outputs.short }}"
          version="${{ steps.version.outputs.version }}"
          tags=(--tag "$IMAGE:$version")
          [ "${{ steps.version.outputs.kind }}" = candidate ] || tags+=(--tag "$IMAGE:latest")
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE:$short"
          echo "named ${{ steps.digest.outputs.digest }} as $version"
      - name: Make the Release tag
        if: steps.version.outputs.cut == 'true'
        # Annotated, as a Release tag is; git refuses one without a
        # committer, and a runner has none. checkout left the job's token
        # on the remote.
        run: |
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag --annotate "v${{ steps.version.outputs.version }}" \
            --message "kiewer ${{ steps.version.outputs.version }}"
          git push origin "refs/tags/v${{ steps.version.outputs.version }}"
      # After the tag: the prune keeps what git lists, so before it the new
      # Release is not on the list and its registry tag would go.
      - name: Prune the registry
        if: steps.version.outputs.prune == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: scripts/prune-images.sh
