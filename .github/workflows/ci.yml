name: CI

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A push to main and a pull request run the checks, build the release
# binaries on the runner, build the runtime-only image around them and,
# on a push to main only, push it to Artifact Registry as :<short hash>
# and deploy it to the staging Cloud Run service. A pushed Release tag
# (v0.4.2, or v0.4.2-rc.1 on a Release candidate) builds nothing: it runs
# the gate and the release job and none of the checks; the gate reads the
# verdict of the same commit's run on main, and the release job names the
# image that run pushed and deploys it to production. The filters are
# globs, not regexes: `+` is one or more of the character before it, `.`
# is a dot. The same two shapes are spelled in scripts/release-tag.sh,
# which refuses any other.
#
# GCP comes in through repository variables, so this file carries nothing
# Terraform (infra/) has to produce: GCP_PROJECT_ID, GCP_WIF_PROVIDER (the
# Workload Identity Federation provider resource name) and GCP_DEPLOY_SA
# (the service account CI impersonates, with Artifact Registry writer and
# Cloud Run developer on the two services).
#
# Every check job delegates to scripts/checks.sh, the same script the
# pre-commit hook runs, so CI and local checks cannot drift. Every cargo job runs its
# command through .github/actions/cargo-cached, which restores a rust-cache
# carrying the workspace crates, marks what the restored build already
# covers as fresh, runs the command and trims the target to what the
# command touched before the save; the action explains.
jobs:
  fmt:
    name: Formatting
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./scripts/checks.sh fmt

  clippy:
    name: Clippy
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/cargo-cached
        with:
          run: ./scripts/checks.sh clippy

  test:
    name: Test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    # Postgres beside the job, as compose.yaml gives a dev box: the same
    # major and the same role, password and database triple, so the
    # DATABASE_URL below is .env.example's. The tests gated on DATABASE_URL
    # (kiewer_lib/tests/db.rs) run here and skip on a box without it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiewer
          POSTGRES_PASSWORD: kiewer
          POSTGRES_DB: kiewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiewer -d kiewer"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://kiewer:kiewer@127.0.0.1:5432/kiewer
      # The GCS emulator the step below starts; the tests gated on it
      # (kiewer_lib/tests/gcs_blob_store.rs) run here and skip on a box
      # without it.
      KIEWER_GCS_EMULATOR: http://127.0.0.1:4443
    steps:
      - uses: actions/checkout@v5
      # The programs the code or its tests run. This list, the Dockerfile's
      # apt layer and the dev-box setup move together: a program one of them
      # gains, all gain in the same commit (Postgres is a service above, not
      # a program on the runner). No apt package yet:
      # - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends <packages>
      #
      # fake-gcs-server, the GCS emulator for kiewer_lib/tests/gcs_blob_store.rs:
      # Google's own storage client against it over plain http on the
      # loopback. Pinned by version and checksum; the tests make their own
      # buckets through its JSON API, so it starts empty. Only the tests run
      # it, so the Dockerfile does not gain it; a dev box runs the same
      # binary (README, Development).
      - name: Start the GCS emulator
        run: |
          version=1.56.1
          curl -fsSLO "https://github.com/fsouza/fake-gcs-server/releases/download/v$version/fake-gcs-server_${version}_Linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/fsouza/fake-gcs-server/releases/download/v$version/checksums.txt"
          grep "fake-gcs-server_${version}_Linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf "fake-gcs-server_${version}_Linux_amd64.tar.gz" fake-gcs-server
          ./fake-gcs-server -scheme http -host 127.0.0.1 -port 4443 -backend memory -public-host 127.0.0.1 &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:4443/storage/v1/b >/dev/null && break; sleep 0.5; done
          rm -f "fake-gcs-server_${version}_Linux_amd64.tar.gz" checksums.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo-cached
        with:
          run: ./scripts/checks.sh test

  docs:
    name: Docs
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo-cached
        with:
          run: ./scripts/checks.sh docs

  # The viewer crate for the browser, through wasm-bindgen. The target
  # comes with the toolchain step; a dev box adds it with rustup (README,
  # Development). wasm-bindgen-cli is installed at the version Cargo.lock
  # names for the wasm-bindgen crate (scripts/wasm-bindgen-version.sh),
  # inside the cached step so the binary rides in the cached cargo bin
  # and the install is a no-op after the first run; the release-build job
  # does the same.
  wasm:
    name: Viewer for wasm32
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/cargo-cached
        with:
          run: |
            cargo install wasm-bindgen-cli --version "$(scripts/wasm-bindgen-version.sh)" --locked
            ./scripts/checks.sh wasm

  msrv:
    name: MSRV
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Read rust-version from the manifest(s) so this job never drifts from
      # what Cargo.toml claims. Lowest version wins in a workspace.
      - id: msrv
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].rust_version | select(. != null)' \
            | sort -V | head -n1)"
          test -n "$version" || { echo "no rust-version in any Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # rust-cache hashes every installed toolchain into its key, and the
      # runner image's preinstalled stable differs between the image versions
      # in rotation, so with stable left beside the MSRV toolchain the job's
      # key followed the runner it landed on and its cache was never found.
      # Nothing after this step needs stable: the toolchain step above made
      # the MSRV toolchain the default.
      - run: rustup toolchain uninstall stable
      - uses: ./.github/actions/cargo-cached
        with:
          run: cargo check --workspace --all-targets

  # The release binaries on every push and pull request, handed to the
  # image job as a workflow artifact with three days of retention, since
  # the image job reads it within the run; a job of its own so it runs
  # beside the other jobs. scripts/release-build.sh is the one spelling
  # of the build, with the build stamp defaulting to the short hash of
  # HEAD. The cargo cache keeps the dependencies warm: GitHub lets a run
  # restore caches saved on its own ref and on the default branch, so a
  # push to main saves and a pull request's run reads main's and saves
  # nothing (a cache on a pull request's ref is read by that pull
  # request's later runs alone). The sha256 lines (the binaries, not
  # cargo's dep-info beside them) are their identity across the
  # hand-over; the image job prints the same lines.
  release-build:
    name: Release build
    if: github.ref_type != 'tag'
    # Pinned, not ubuntu-latest: the binaries link this runner's glibc
    # and must start on the Dockerfile's base, whose comment has the rule.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The wasm32 target and wasm-bindgen-cli as in the wasm job: the
      # release build starts with the viewer for the browser, which the
      # server binary embeds.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/cargo-cached
        with:
          shared-key: release
          save: ${{ github.event_name == 'push' }}
          run: |
            cargo install wasm-bindgen-cli --version "$(scripts/wasm-bindgen-version.sh)" --locked
            ./scripts/release-build.sh
      - run: sha256sum $(ls -d target/release/kiewer* | grep -v '\.d$')
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/kiewer*
            !target/release/*.d
          if-no-files-found: error
          retention-days: 3

  # The image on every push and pull request: the binaries come down, the
  # Dockerfile copies them in (no toolchain here; a plain docker build,
  # since a copy-only image has nothing worth a layer cache). On a push to
  # main the image is pushed to Artifact Registry as :<short hash>, the
  # digest printed, and that digest deployed to the staging service. A
  # pull request's run stops before the push (the last steps are for a
  # push; a fork has no identity to federate anyway), so the registry
  # holds only what main pushed. Pruning is the registry's cleanup
  # policy, defined in infra/.
  image:
    name: Image
    if: github.ref_type != 'tag'
    needs: [release-build]
    # Pinned like release-build, one runner image for the three shipping
    # jobs; nothing links here.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: europe-west4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kiewer/kiewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: target/release
      - run: sha256sum $(ls -d target/release/kiewer* | grep -v '\.d$')
      - id: short
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # --provenance=false: one manifest and no attestation, so the registry
      # lists one image per push.
      - run: docker build --provenance=false --build-arg "BUILD_VERSION=${{ steps.short.outputs.hash }}" -t "$IMAGE:ci" .
      # A project's smoke test goes here, between the build and the push:
      # a run of the image against what it needs, so what is pushed is
      # what ran. Without one, the push follows the build.
      #
      # The push and the deploy wait for the GCP variables: until the
      # Terraform in infra/ has produced them, a push to main builds the
      # image and ships nothing, and the run stays green.
      - if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2
      - if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Push the image as its short hash
        if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        id: push
        # The digest line is what the release job will name; its own
        # line names the same digest.
        shell: bash
        run: |
          short="${{ steps.short.outputs.hash }}"
          docker tag "$IMAGE:ci" "$IMAGE:$short"
          docker push "$IMAGE:$short"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$short")"
          echo "pushed $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Every push to main is a staging deploy of the image just pushed,
      # by digest. gcloud waits for the new revision to become ready and
      # fails the job if it does not; traffic moves only on success.
      - name: Deploy to staging
        if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        run: |
          gcloud run deploy kiewer-staging --project "${{ vars.GCP_PROJECT_ID }}" \
            --region europe-west4 --image "${{ steps.push.outputs.digest }}" --quiet

  # The gate in front of the release, on a pushed Release tag only. Three
  # questions, the first two answered in seconds: is it the Version behind
  # a `v`, is the tagged commit on main, and has that commit's own run on
  # main gone green. GitHub runs CI for the head of a push only, so a
  # Release tag on any other commit has no run to read and fails here: the
  # Release tag is the head of its push (scripts/release-tag.sh puts it on
  # the bump commit, the last of the batch).
  release-tag:
    name: Release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The wait is 30 minutes at most; the rest is seconds.
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The ancestor check needs the history, not the one commit.
          fetch-depth: 0
      - name: The Release tag is the Version
        # bash by name is bash with pipefail, so a read that fails is not
        # taken as an empty Version.
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kiewer") | .version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the Release tag is $GITHUB_REF_NAME and the Version at its commit is $version; it must be v<Version>, as made by scripts/release-tag.sh on the bump commit"
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main; push main with the Release tag (git push --follow-tags)"
            exit 1
          fi
      - name: The commit's run on main is green
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushed together, the two runs start together, so the run on main
        # is usually still in its Test or Image job: poll every 30 s for up
        # to 30 minutes. A red run fails this at once; rerun the red job on
        # main, then rerun this run. A Release tag's run carries the tag's
        # name as its branch, so --branch main never finds this run itself.
        # A run that is not listed yet gets two minutes to appear before
        # its absence is taken to mean the Release tag is not the head of
        # a push.
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          for attempt in $(seq 1 60); do
            if ! run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --commit "$commit" --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty')"; then
              echo "could not list the runs; trying again"
            elif [ -z "$run" ]; then
              if [ "$attempt" -gt 4 ]; then
                echo "::error::main has no CI run for $commit. CI runs for the head of a push only, so the Release tag must be on the last commit pushed; the way out is a new patch Version"
                exit 1
              fi
            elif [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion="$(jq -r .conclusion <<<"$run")"
              if [ "$conclusion" = success ]; then
                echo "green: $(jq -r .url <<<"$run")"
                exit 0
              fi
              echo "::error::the run on main concluded $conclusion: $(jq -r .url <<<"$run"). Rerun its red job, then rerun this run"
              exit 1
            fi
            sleep 30
          done
          echo "::error::the run on main for $commit gave no verdict in 30 minutes"
          exit 1

  # On a pushed Release tag, behind the gate above, and building nothing:
  # read the digest of the :<short hash> image that main's run pushed for
  # this commit (the gate waited for that run), give it the :<Version> tag,
  # and :latest unless it is a Release candidate, then deploy that digest
  # to the production service. A Release moves traffic to the new
  # revision once it is ready; a Release candidate becomes a revision with
  # no traffic under the Cloud Run tag `rc`, reachable on its tag URL
  # (https://rc---kiewer-<hash>.a.run.app), so it is tried by hand and the
  # plain Release that follows moves traffic. The image production runs
  # is the image main's run built and staging already ran.
  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [release-tag]
    # Pinned like release-build, one runner image for the three shipping
    # jobs; nothing links here.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: europe-west4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kiewer/kiewer
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Name the image main pushed for this commit
        id: name
        # The short hash is the image's identity. No image under it means
        # main's run pushed none (the image job is the one that pushes, on
        # a push to main only) or the registry's cleanup policy took it
        # (later pushes to main beyond the kept unreleased images); either
        # way this tag cannot ship and the way out is a new patch Version.
        # The Version is the Release tag's, which the gate proved equal to
        # the manifest's. imagetools create adds a tag to the manifest in
        # the registry without a pull; --prefer-index=false keeps it the
        # same manifest and digest.
        shell: bash
        run: |
          short="$(git rev-parse --short HEAD)"
          version="${GITHUB_REF_NAME#v}"
          if ! digest="$(docker buildx imagetools inspect "$IMAGE:$short" --format '{{.Manifest.Digest}}' 2>/dev/null)" || [ -z "$digest" ]; then
            echo "::error::the registry has no $IMAGE:$short. main's run for $short pushed none, or the cleanup policy took it; the way out is a new patch Version"
            exit 1
          fi
          tags=(--tag "$IMAGE:$version")
          case "$version" in
            *-rc.*) ;;
            *) tags+=(--tag "$IMAGE:latest") ;;
          esac
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE:$short"
          echo "named $IMAGE@$digest as $version"
          echo "digest=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Deploy to production
        shell: bash
        run: |
          case "${{ steps.name.outputs.version }}" in
            *-rc.*) traffic=(--no-traffic --tag rc) ;;
            *) traffic=() ;;
          esac
          gcloud run deploy kiewer --project "${{ vars.GCP_PROJECT_ID }}" \
            --region europe-west4 --image "${{ steps.name.outputs.digest }}" \
            "${traffic[@]}" --quiet
