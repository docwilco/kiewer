[workspace]
resolver = "3"
members = ["kicad_core", "kiewer_viewer", "kiewer_lib", "kiewer", "kiewer_test_support"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# google-cloud-auth 1.18 (kiewer_lib, the GCS store) needs 1.91; wgpu 30 needs 1.87
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/docwilco/kiewer"

[workspace.lints.rust]
# an unsafe fn body gets no implicit unsafe powers: every unsafe operation
# carries its own block and its own SAFETY comment
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Pedantic with no blanket allows: every finding is fixed or carries a
# site-level #[expect(..., reason = "...")] naming the invariant that makes
# it safe.
pedantic = { level = "warn", priority = -1 }
# every unsafe block carries a // SAFETY: comment
undocumented_unsafe_blocks = "warn"
